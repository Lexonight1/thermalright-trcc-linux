name: Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    # A ceiling, not a target: ~2-3x the slowest run measured 2026-10-01, and
    # above that day's slow-mirror outlier.  Without one a hang holds the
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ".[nvidia,windows]"

      # Use 7-Zip pre-installed on the runner — no download needed, no network flakiness
      - name: Prepare 7-Zip for bundling
        run: |
          New-Item -ItemType Directory -Force -Path 7z-standalone | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe" -Destination 7z-standalone\7za.exe -Force
          Copy-Item "C:\Program Files\7-Zip\7z.dll" -Destination 7z-standalone\7za.dll -Force

      # Download ffmpeg essentials (LGPL) for video playback — C# app bundles it too
      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $ffmpegExe = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination ffmpeg.exe -Force

      # Ensure libusb DLL is available (pyusb loads via ctypes, PyInstaller misses it)
      - name: Download libusb
        run: |
          pip install libusb-package
          $libusb = python -c "import libusb_package; print(libusb_package.get_library_path())"
          echo "LIBUSB_PATH=$libusb" >> $env:GITHUB_OUTPUT
        id: libusb

      # PawnIO (namazso) — the signed driver TRCC reads CPU temperature and
      # power through (#319), its installer, and the two signed modules TRCC
      # runs on it.  Modules: PawnIO.Modules 0.2.11, LGPL-2.1.  Installer:
      # PawnIO.Setup 2.2.0, redistribution allowed.  Pinned by SHA-256: each
      # value is GitHub's own asset digest, and the installer's matches winget's.
      - name: Download PawnIO
        run: |
          $mods = "https://github.com/namazso/PawnIO.Modules/releases/download/0.2.11/release_0_2_11.zip"
          Invoke-WebRequest -Uri $mods -OutFile pawnio-modules.zip
          $hash = (Get-FileHash pawnio-modules.zip -Algorithm SHA256).Hash
          if ($hash -ne "43608CB89BC84247FEF1368A139013F7D043E17DB6D6C8DFC9B46BF0905A81F4") {
            throw "PawnIO.Modules 0.2.11 hash mismatch: $hash"
          }
          Expand-Archive -Path pawnio-modules.zip -DestinationPath pawnio-modules -Force
          $setup = "https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe"
          New-Item -ItemType Directory -Force -Path installer/pawnio | Out-Null
          Invoke-WebRequest -Uri $setup -OutFile installer/pawnio/PawnIO_setup.exe
          $hash = (Get-FileHash installer/pawnio/PawnIO_setup.exe -Algorithm SHA256).Hash
          if ($hash -ne "1F519A22E47187F70A1379A48CA604981C4FCF694F4E65B734AAA74A9FBA3032") {
            throw "PawnIO_setup 2.2.0 hash mismatch: $hash"
          }

      # libjpeg-turbo's TurboJPEG library: JPEG panel frames at full colour
      # (#336; Qt's own writer drops to 4:2:0 below quality 91).  The official
      # build, pinned by SHA-256 (GitHub's asset digest).  turbojpeg.dll
      # imports only KERNEL32 -- no VC runtime.  Its licence ships with it.
      - name: Download libjpeg-turbo
        run: |
          $url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.1/libjpeg-turbo-3.2.1-vc-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile libjpeg-turbo.exe
          $hash = (Get-FileHash libjpeg-turbo.exe -Algorithm SHA256).Hash
          if ($hash -ne "1F05BC3ED1585E6B12A8B0C24C8C5F07B1F6D90D01B4B709B331BEDC9D6E5838") {
            throw "libjpeg-turbo 3.2.1 hash mismatch: $hash"
          }
          & "C:\Program Files\7-Zip\7z.exe" x -olibjpeg-turbo libjpeg-turbo.exe bin/turbojpeg.dll doc/LICENSE.md
          if ($LASTEXITCODE -ne 0) { throw "could not extract turbojpeg.dll" }
          Copy-Item libjpeg-turbo/bin/turbojpeg.dll -Destination turbojpeg.dll -Force

      # Build CLI exe (with console) and GUI exe (without console)
      - name: Build CLI with PyInstaller
        run: |
          pyinstaller `
            --name trcc `
            --onedir `
            --console `
            --icon src/trcc/assets/icons/app.ico `
            --add-data "src/trcc/assets;trcc/assets" `
            --add-data "src/trcc/ui/gui/assets;trcc/ui/gui/assets" `
            --add-data "src/trcc/modules/rgb;trcc/modules/rgb" `
            --add-binary "turbojpeg.dll;." `
            --add-data "libjpeg-turbo/doc/LICENSE.md;licenses/libjpeg-turbo" `
            --exclude-module trcc.modules.visualizer `
            --hidden-import PySide6.QtSvg `
            --hidden-import pynvml `
            --hidden-import wmi `
            --hidden-import soundcard `
            --collect-submodules trcc `
            --noconfirm `
            src/trcc/__main__.py

      # Only its exe is kept: it runs on the CLI build's _internal folder,
      # which carries turbojpeg.dll.
      - name: Build GUI with PyInstaller
        run: |
          pyinstaller `
            --name trcc-gui `
            --onedir `
            --windowed `
            --icon src/trcc/assets/icons/app.ico `
            --add-data "src/trcc/assets;trcc/assets" `
            --add-data "src/trcc/ui/gui/assets;trcc/ui/gui/assets" `
            --add-data "src/trcc/modules/rgb;trcc/modules/rgb" `
            --exclude-module trcc.modules.visualizer `
            --hidden-import PySide6.QtSvg `
            --hidden-import pynvml `
            --hidden-import wmi `
            --hidden-import soundcard `
            --collect-submodules trcc `
            --noconfirm `
            src/trcc/__main__.py
          # Merge GUI exe into CLI dist folder (share the runtime)
          Copy-Item -Path dist/trcc-gui/trcc-gui.exe -Destination dist/trcc/ -Force
          # Bundle 7z for theme extraction (LGPL, redistributable)
          Copy-Item -Path 7z-standalone/7za.exe -Destination dist/trcc/7z.exe -Force
          Copy-Item -Path 7z-standalone/7za.dll -Destination dist/trcc/7z.dll -Force
          # Bundle ffmpeg for video playback (LGPL, like C# app)
          Copy-Item -Path ffmpeg.exe -Destination dist/trcc/ffmpeg.exe -Force
          # Bundle libusb (pyusb loads via ctypes, PyInstaller misses it)
          if ("${{ steps.libusb.outputs.LIBUSB_PATH }}") {
            Copy-Item -Path "${{ steps.libusb.outputs.LIBUSB_PATH }}" -Destination dist/trcc/ -Force
          }
          # Bundle the PawnIO modules beside trcc.exe (_pawnio_cpu.module_dir).
          New-Item -ItemType Directory -Force -Path dist/trcc/pawnio | Out-Null
          foreach ($f in "IntelMSR.bin", "AMDFamily17.bin", "LpcIO.bin", "COPYING") {
            Copy-Item -Path "pawnio-modules/$f" -Destination dist/trcc/pawnio/ -Force
          }

      - name: Log build environment
        run: |
          Write-Host "=== Windows Build Environment ==="
          Write-Host "OS: $([System.Environment]::OSVersion)"
          Write-Host "Python: $(python --version)"
          Write-Host "PyInstaller: $(python -c 'import PyInstaller; print(PyInstaller.__version__)')"
          Write-Host "PySide6: $(python -c 'import PySide6; print(PySide6.__version__)')"
          Write-Host "Working dir: $(Get-Location)"

      - name: Verify bundled dependencies
        run: |
          Write-Host "=== Bundle Contents ==="
          Write-Host "--- dist/trcc/ (top-level) ---"
          Get-ChildItem "dist/trcc/*.exe" | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }
          Get-ChildItem "dist/trcc/*.dll" | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB, 0)) KB)" }
          Write-Host "--- Total files ---"
          $total = (Get-ChildItem "dist/trcc" -Recurse | Measure-Object).Count
          $size = (Get-ChildItem "dist/trcc" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "  $total files, $([math]::Round($size, 1)) MB total"
          Write-Host ""
          Write-Host "=== Verification ==="
          $missing = @()
          if (-not (Test-Path "dist/trcc/trcc.exe")) { $missing += "trcc.exe" }
          if (-not (Test-Path "dist/trcc/trcc-gui.exe")) { $missing += "trcc-gui.exe" }
          if (-not (Test-Path "dist/trcc/7z.exe")) { $missing += "7z.exe" }
          if (-not (Test-Path "dist/trcc/7z.dll")) { $missing += "7z.dll" }
          if (-not (Test-Path "dist/trcc/ffmpeg.exe")) { $missing += "ffmpeg.exe" }
          $libusb = Get-ChildItem "dist/trcc/libusb*" -ErrorAction SilentlyContinue
          if (-not $libusb) { $missing += "libusb-1.0.dll" }
          if (-not (Test-Path "dist/trcc/_internal/turbojpeg.dll")) { $missing += "_internal/turbojpeg.dll" }
          if (-not (Test-Path "dist/trcc/_internal/licenses/libjpeg-turbo/LICENSE.md")) { $missing += "libjpeg-turbo LICENSE.md" }
          foreach ($f in "IntelMSR.bin", "AMDFamily17.bin", "LpcIO.bin", "COPYING") {
            if (-not (Test-Path "dist/trcc/pawnio/$f")) { $missing += "pawnio/$f" }
          }
          if (-not (Test-Path "installer/pawnio/PawnIO_setup.exe")) { $missing += "installer/pawnio/PawnIO_setup.exe" }
          if ($missing.Count -gt 0) {
            Write-Error "FAILED — Missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "PASSED — trcc.exe, trcc-gui.exe, 7z.exe, ffmpeg.exe, libusb, turbojpeg, PawnIO OK"

      - name: Smoke-run the frozen CLI
        # The checks above prove files exist, not that the frozen program
        # starts: #166, #187 and #188 were all launch crashes of a bundle that
        # passed them.  The integrity level is logged because trcc.exe used to
        # carry --uac-admin, which fails with error 740 on a non-elevated runner.
        run: |
          whoami /groups | Select-String "Mandatory Label"
          $out = & dist\trcc\trcc.exe --version 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "trcc \d+\.\d+\.\d+") {
            Write-Error "FAILED — the frozen trcc.exe did not run (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "PASSED — the frozen trcc.exe runs"

      - name: Smoke the frozen app's JPEG encoder
        # The file being there proves nothing: the frozen app must LOAD it.
        # The doctor's jpeg-encoder line comes from turbojpeg.load() itself.
        # In-process (TRCC_DAEMON=0); its exit code is the other checks'.
        timeout-minutes: 5
        env:
          TRCC_DAEMON: "0"
        run: |
          $out = & dist\trcc\trcc.exe system doctor 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "jpeg-encoder\s+libturbojpeg -- JPEG panel frames keep full colour \(4:4:4\)") {
            Write-Error "FAILED — the frozen trcc.exe does not load its turbojpeg.dll"
            exit 1
          }
          Write-Host "PASSED — the frozen trcc.exe encodes JPEG at 4:4:4"

      - name: Smoke the Visualizer as an add-on, then draw TRCC Pipes from it
        # The Visualizer is an add-on: the frozen app must NOT carry it
        # (--exclude-module above; 34 of its modules were baked in without
        # it), and must run it once installed -- from the user folder, as an
        # upgrader gets it.  Installed here from its source folder in
        # developer mode, the same files the module index ships.
        #
        # TRCC Pipes draws with OpenGL.  This runner has no graphics card --
        # Windows offers only its own OpenGL 1.1 ("GDI Generic"), which TRCC
        # refuses -- so the tile draws only if WglSurface.open finds the
        # software OpenGL Qt ships (opengl32sw.dll) beside PySide6 in the
        # bundle.  That is the case of every VM, Remote Desktop session and
        # box without its graphics driver.  Drawing a gallery tile needs no
        # sound card and no panel.
        timeout-minutes: 5
        run: |
          $trcc = "dist\trcc\trcc.exe"
          function Invoke-Trcc {
            $out = & $trcc @args 2>&1 | Out-String
            Write-Host "> trcc $args`n$out"
            if ($LASTEXITCODE -ne 0) {
              & $trcc report -o - --log-lines 200
              Write-Error "FAILED — trcc $args (exit $LASTEXITCODE)"
              exit 1
            }
            return $out
          }
          $listed = Invoke-Trcc system modules list
          if ($listed -match "visualizer") {
            Write-Error "FAILED — the frozen app carries the Visualizer; it must be an add-on"
            exit 1
          }
          Write-Host "PASSED — the frozen app does not carry the Visualizer"
          Invoke-Trcc system modules developer on | Out-Null
          Invoke-Trcc system modules install-folder src\trcc\modules\visualizer --yes | Out-Null
          Invoke-Trcc system modules on visualizer | Out-Null
          $tile = Join-Path $env:RUNNER_TEMP "pipes.png"
          $out = & dist\trcc\trcc.exe display visual-tile trcc-pipes -o $tile --size 64 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $tile)) {
            Get-ChildItem "dist/trcc/_internal/PySide6/opengl32sw.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  bundled: $($_.FullName)" }
            Write-Error "FAILED — the frozen app could not draw TRCC Pipes (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "PASSED — the frozen app draws TRCC Pipes without a graphics card"

      - name: Smoke a user module in the frozen app
        # A module the user installs lands in %LOCALAPPDATA%\trcc-user\modules,
        # outside the bundle, and the frozen app must import it from there.
        # The skeleton module is not in the bundle (it lives in dev/), so
        # "Hello, CI!" can only come from the user folder: its Command ran in
        # the App and its command reached trcc.
        timeout-minutes: 5
        run: |
          $trcc = "dist\trcc\trcc.exe"
          function Invoke-Trcc {
            $out = & $trcc @args 2>&1 | Out-String
            Write-Host "> trcc $args`n$out"
            if ($LASTEXITCODE -ne 0) {
              & $trcc report -o - --log-lines 200
              Write-Error "FAILED — trcc $args (exit $LASTEXITCODE)"
              exit 1
            }
          }
          Invoke-Trcc system modules developer on
          Invoke-Trcc system modules install-folder dev\module_template\hello --yes
          Invoke-Trcc system modules on hello
          $out = & $trcc hello CI 2>&1 | Out-String
          Write-Host "> trcc hello CI`n$out"
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "Hello, CI!") {
            & $trcc system modules list
            & $trcc report -o - --log-lines 200
            Write-Error "FAILED — the frozen app did not run a module from the user folder (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "PASSED — the frozen app runs a module from the user folder"

      - name: Extract version
        id: version
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Create Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/trcc.iss
          options: /DAPP_VERSION=${{ steps.version.outputs.VERSION }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: trcc-windows-installer
          path: installer/Output/trcc-${{ steps.version.outputs.VERSION }}-setup.exe

      - name: Create fixed-name alias for stable download URL
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Copy-Item "installer/Output/trcc-${{ steps.version.outputs.VERSION }}-setup.exe" `
            "installer/Output/trcc-latest-setup.exe"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} `
            "installer/Output/trcc-${{ steps.version.outputs.VERSION }}-setup.exe" `
            "installer/Output/trcc-latest-setup.exe" `
            --clobber
