name: macOS Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A ceiling, not a target: ~2-3x the slowest run measured 2026-10-01, and
    # above that day's slow-mirror outlier.  Without one a hang holds the
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    # One DMG per architecture (#219).  Not universal2: the app bundles
    # Homebrew's 7z, ffmpeg and libusb, and Homebrew ships each only for the
    # host architecture -- a universal2 PyInstaller app would still carry
    # arm64-only tools.  macos-15-intel is the LAST x86_64 image GitHub
    # offers; it is retired in August 2027, and the Intel leg with it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            suffix: ""
          - runner: macos-15-intel
            arch: x86_64
            suffix: "-intel"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          brew install libusb create-dmg sevenzip ffmpeg dylibbundler openssl@3

      - name: Install Python dependencies
        # cryptography ships no Intel Mac wheel since 49.0.0, so on x86_64 pip
        # builds it from source -- linked against Homebrew's libssl.3.dylib by
        # default, which PyInstaller then bundles beside Python's own older
        # libssl.3.dylib under the same name: the app died at startup on
        # "Symbol not found: _SSL_get0_group_name".  OPENSSL_STATIC=1 links
        # OpenSSL into the extension, as cryptography's own wheels are built
        # (cryptography.io, "Building cryptography on macOS").  A wheel
        # install -- arm64 -- never reads it.
        env:
          OPENSSL_STATIC: "1"
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ".[nvidia,hid]"

      - name: Extract version
        id: version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "VERSION=$ver" >> "$GITHUB_OUTPUT"

      - name: Generate macOS icon
        run: |
          ICONSET=src/trcc/assets/icons/app.iconset
          mkdir -p "$ICONSET"
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz src/trcc/assets/icons/trcc.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            double=$((sz * 2))
            if [ $double -le 1024 ]; then
              sips -z $double $double src/trcc/assets/icons/trcc.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$ICONSET" -o src/trcc/assets/icons/app.icns

      - name: Build app with PyInstaller
        run: |
          pyinstaller \
            --name "TRCC" \
            --onedir \
            --windowed \
            --icon src/trcc/assets/icons/app.icns \
            --add-data "src/trcc/assets:trcc/assets" \
            --add-data "src/trcc/ui/gui/assets:trcc/ui/gui/assets" \
            --add-data "src/trcc/modules:trcc/modules" \
            --hidden-import PySide6.QtSvg \
            --hidden-import pynvml \
            --collect-all catap \
            --collect-submodules trcc \
            --osx-bundle-identifier com.thermalright.trcc \
            --noconfirm \
            src/trcc/__main__.py

      - name: Say why TRCC asks to hear the Mac
        run: |
          # The audio visuals record what the Mac plays (a Core Audio tap).
          # macOS shows this text in the "System Audio Recording" prompt;
          # without it the tap records silence.
          plutil -insert NSAudioCaptureUsageDescription -string \
            "TRCC draws what your Mac is playing on your cooler's screen." \
            dist/TRCC.app/Contents/Info.plist
          plutil -extract NSAudioCaptureUsageDescription raw \
            dist/TRCC.app/Contents/Info.plist

      - name: Log PyInstaller output
        run: |
          echo "=== dist/ top-level ==="
          ls -la dist/
          echo "=== .app bundle MacOS/ (with symlinks) ==="
          ls -la dist/TRCC.app/Contents/MacOS/ 2>/dev/null || echo "No MacOS/ dir"
          echo "=== .app bundle Frameworks/ (first 10) ==="
          ls dist/TRCC.app/Contents/Frameworks/ 2>/dev/null | head -10 || echo "No Frameworks/ dir"
          echo "=== Finding TRCC executable (following symlinks) ==="
          find -L dist/TRCC.app -name "TRCC" -type f 2>/dev/null || echo "No TRCC found"

      - name: Bundle dependencies
        run: |
          # Bundle 7-Zip for theme extraction.  `7zz` from Homebrew's
          # sevenzip is one real binary; p7zip's `7z` is a shell WRAPPER that
          # execs Homebrew's own copy, so bundled it pointed at a path no
          # user without Homebrew has (#219).  The toolchain tries 7z, 7zz,
          # 7za, 7zr, and the app puts this folder first on PATH when frozen.
          cp "$(which 7zz)" dist/TRCC.app/Contents/MacOS/7zz
          # Bundle ffmpeg for video playback (LGPL, like C# app).  Homebrew's
          # ffmpeg is dynamic -- ~20 dylibs under /opt/homebrew -- so copy
          # those in beside it and point it at them (#219).  Rewriting a
          # load path breaks the signature, and Apple Silicon refuses to run
          # an invalid one, so everything touched is ad-hoc re-signed.
          cp "$(which ffmpeg)" dist/TRCC.app/Contents/MacOS/ffmpeg
          dylibbundler -od -b -x dist/TRCC.app/Contents/MacOS/ffmpeg \
            -d dist/TRCC.app/Contents/Frameworks/ffmpeg/ \
            -p @executable_path/../Frameworks/ffmpeg/
          codesign --force -s - dist/TRCC.app/Contents/Frameworks/ffmpeg/*.dylib \
            dist/TRCC.app/Contents/MacOS/ffmpeg
          # NOTE: no CLI symlink — macOS APFS is case-insensitive,
          # ln -sf TRCC .../trcc would DELETE the TRCC executable

          # Bundle libusb (pyusb loads via ctypes, PyInstaller misses it)
          LIBUSB_DYLIB="$(brew --prefix libusb)/lib/libusb-1.0.dylib"
          if [ -f "$LIBUSB_DYLIB" ]; then
            cp "$LIBUSB_DYLIB" dist/TRCC.app/Contents/Frameworks/
          fi

      - name: Log build environment
        run: |
          echo "=== macOS Build Environment ==="
          echo "macOS: $(sw_vers -productVersion)"
          echo "Arch: $(uname -m)"
          echo "Python: $(python3 --version)"
          echo "PyInstaller: $(python3 -c 'import PyInstaller; print(PyInstaller.__version__)')"
          echo "PySide6: $(python3 -c 'import PySide6; print(PySide6.__version__)')"
          echo "7zz: $(which 7zz || echo 'not found')"
          echo "ffmpeg: $(which ffmpeg || echo 'not found')"
          echo "libusb: $(brew --prefix libusb)/lib/libusb-1.0.dylib"

      - name: Verify bundled dependencies
        run: |
          echo "=== Full Bundle Structure (following symlinks) ==="
          find -L dist/TRCC.app/Contents -type f | head -50
          echo ""
          echo "=== Contents/MacOS/ ==="
          ls -la dist/TRCC.app/Contents/MacOS/ 2>/dev/null || echo "(empty or missing)"
          echo "=== Contents/Frameworks/ (first 20) ==="
          ls -la dist/TRCC.app/Contents/Frameworks/ 2>/dev/null | head -20 || echo "(empty or missing)"
          echo "=== Contents/Resources/ (first 10) ==="
          ls dist/TRCC.app/Contents/Resources/ 2>/dev/null | head -10 || echo "(empty or missing)"
          echo ""
          echo "=== Verification ==="
          missing=()
          # Check TRCC executable directly (PyInstaller puts it in Contents/MacOS/)
          if [ -f "dist/TRCC.app/Contents/MacOS/TRCC" ]; then
            echo "  TRCC executable: dist/TRCC.app/Contents/MacOS/TRCC ($(wc -c < dist/TRCC.app/Contents/MacOS/TRCC) bytes)"
          else
            echo "  TRCC executable: NOT FOUND in Contents/MacOS/"
            echo "  All executables in bundle (following symlinks):"
            find -L dist/TRCC.app -type f -perm +111 2>/dev/null | head -20
            missing+=("TRCC")
          fi
          [ -f "dist/TRCC.app/Contents/MacOS/7zz" ] && echo "  7zz: OK" || missing+=("7zz")
          [ -f "dist/TRCC.app/Contents/MacOS/ffmpeg" ] && echo "  ffmpeg: OK" || missing+=("ffmpeg")
          # libusb could be in Frameworks (PyInstaller) or copied there by us
          if find -L dist/TRCC.app/Contents/Frameworks -name "libusb*" -type f 2>/dev/null | grep -q .; then
            echo "  libusb: OK"
          else
            missing+=("libusb")
          fi
          echo ""
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::FAILED — Missing: ${missing[*]}"
            exit 1
          fi
          echo "PASSED — all dependencies bundled"

      - name: Verify the app's architecture
        run: |
          # The #219 DMG was arm64-only and nothing noticed until an Intel user
          # could not launch it.  Every leg must produce ITS architecture.
          for bin in TRCC 7zz ffmpeg; do
            info="$(file "dist/TRCC.app/Contents/MacOS/$bin")"
            echo "$info"
            case "$info" in
              *${{ matrix.arch }}*) ;;
              *) echo "::error::$bin is not ${{ matrix.arch }}"; exit 1 ;;
            esac
          done

      - name: Verify bundled tools run without Homebrew
        run: |
          # A tool copied out of Homebrew still loads its libraries FROM
          # Homebrew.  Bundled, it must link only the system -- or it cannot
          # start on the Mac of anyone who has not installed the same formula.
          # The libraries bundled for ffmpeg are checked too: one of them
          # reaching back into Homebrew fails the same way, one load later.
          fail=0
          for bin in dist/TRCC.app/Contents/MacOS/7zz dist/TRCC.app/Contents/MacOS/ffmpeg \
                     dist/TRCC.app/Contents/Frameworks/ffmpeg/*.dylib; do
            deps="$(otool -L "$bin" | tail -n +2)"
            echo "== $bin"; echo "$deps"
            if echo "$deps" | grep -qE '/opt/homebrew|/usr/local/(Cellar|opt|lib)'; then
              echo "::error::$bin links Homebrew libraries — it will not start without Homebrew"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          # Then RUN them with Homebrew's copies gone -- otool reads the load
          # commands; only a launch proves the loader and signatures accept it.
          brew uninstall --ignore-dependencies ffmpeg sevenzip
          dist/TRCC.app/Contents/MacOS/7zz i > /dev/null && echo "7zz runs"
          dist/TRCC.app/Contents/MacOS/ffmpeg -hide_banner -version > /dev/null && echo "ffmpeg runs"

      - name: Smoke-run the frozen CLI
        # The checks above prove files exist and link, not that the frozen
        # program starts -- on Windows, #166, #187 and #188 were all launch
        # crashes of a bundle that passed them.
        timeout-minutes: 5
        run: |
          out="$(dist/TRCC.app/Contents/MacOS/TRCC --version 2>&1)" || {
            echo "$out"; echo "::error::the frozen TRCC did not run"; exit 1; }
          echo "$out"
          echo "$out" | grep -qE 'trcc [0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::the frozen TRCC did not print its version"; exit 1; }
          echo "PASSED — the frozen TRCC runs"

      - name: Smoke a user module in the frozen app
        # A module the user installs lands in ~/Library/Application Support/
        # trcc-user/modules, outside the bundle, and the frozen app must import
        # it from there.  The skeleton module is not in the bundle (it lives in
        # dev/), so "Hello, CI!" can only come from the user folder: its Command
        # ran in the App and its command reached trcc.  Here the CLI starts the
        # shared App, so the step stops it however it ends.
        timeout-minutes: 5
        run: |
          trcc=dist/TRCC.app/Contents/MacOS/TRCC
          trap '"$trcc" kill || true' EXIT
          fail() { "$trcc" system modules list || true
                   "$trcc" report --log-lines 200 || true
                   echo "::error::$1"; exit 1; }
          for step in "system modules developer on" \
                      "system modules install-folder dev/module_template/hello --yes" \
                      "system modules on hello"; do
            echo "> trcc $step"
            # shellcheck disable=SC2086  # each step is words, split on purpose
            "$trcc" $step || fail "trcc $step (exit $?)"
          done
          rc=0; out="$("$trcc" hello CI 2>&1)" || rc=$?
          [ "$rc" = 0 ] || { echo "$out"; fail "trcc hello CI (exit $rc)"; }
          echo "$out"
          echo "$out" | grep -qF 'Hello, CI!' \
            || fail "the frozen app did not run a module from the user folder"
          echo "PASSED — the frozen app runs a module from the user folder"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "TRCC ${{ steps.version.outputs.VERSION }}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "TRCC.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "trcc-${{ steps.version.outputs.VERSION }}-macos${{ matrix.suffix }}.dmg" \
            dist/TRCC.app

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: trcc-macos${{ matrix.suffix }}-dmg
          path: trcc-${{ steps.version.outputs.VERSION }}-macos${{ matrix.suffix }}.dmg

      - name: Create fixed-name alias for stable download URL
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp "trcc-${{ steps.version.outputs.VERSION }}-macos${{ matrix.suffix }}.dmg" trcc-latest-macos${{ matrix.suffix }}.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "trcc-${{ steps.version.outputs.VERSION }}-macos${{ matrix.suffix }}.dmg" \
            trcc-latest-macos${{ matrix.suffix }}.dmg \
            --clobber
